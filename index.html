<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Engine | Resume Matcher</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Job Application Engine</h1>
            <p>Automated Machine Learning Resume Screening</p>
        </header>

        <div class="main-grid">
            <div class="input-card">
                <label>Candidate Resume</label>
                <textarea id="resumeInput" placeholder="Paste resume text here..."></textarea>
            </div>
            <div class="input-card">
                <label>Job Description</label>
                <textarea id="jobInput" placeholder="Paste job requirements here..."></textarea>
            </div>
        </div>

        <div class="action-area">
            <button id="analyzeBtn" onclick="processMatch()">Analyze Match Percent</button>
        </div>

        <div id="resultCard" class="result-card hidden">
            <h3>Match Analysis Result</h3>
            <div class="score-circle">
                <span id="scoreValue">0</span>%
            </div>
            <p id="feedbackText"></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
